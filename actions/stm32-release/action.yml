name: "Publish STM32 Firmware (GitHub Release → AWS CodeArtifact)"
description: |
  Bundles STM32 firmware artifacts, uploads them to a GitHub release, and
  publishes the bundle to AWS CodeArtifact. Mirrors the behaviour of the
  Python build-deploy action: pull_request events push to the DEV repository,
  while pushes to refs/heads/main target the PROD repository.

inputs:
  tag:
    description: "Version tag to use (e.g., BCU_BL_v1.2.3 or v1.2.3-rc1). A clean semver is extracted for publishing."
    required: true
  artifact-pattern:
    description: "Artifact name or glob pattern to download (actions/download-artifact pattern syntax)."
    required: true
  package-name:
    description: "CodeArtifact package name to publish."
    required: true
  namespace:
    description: "CodeArtifact namespace for the generic package (required by generic format, e.g., 'bcu')."
    required: true
  github_token:
    description: "Token for 'gh' to call releases/generate-notes (usually GITHUB_TOKEN)."
    required: true
  release-name:
    description: "Override GitHub release name base (defaults to package-name)."
    required: false
    default: ""
  dev-tag:
    description: >-
      Optional. On a push to a branch other than main, tag the built commit with this
      name (dev/<prefix><version>, from version-c's dev_tag output) before publishing
      to the DEV repository. The tag is claimed first: a tag on another commit, or a
      DEV package version with no tag, fails the run instead of being skipped. Needs
      contents: write for github_token. Empty (default) keeps the old behaviour.
    required: false
    default: ""

outputs:
  release-notes:
    description: "Release notes Markdown derived from the associated pull request."
    value: ${{ steps.release-body.outputs.body }}

runs:
  using: "composite"
  steps:
    - name: Prepare release workspace
      shell: bash
      run: |
        set -euo pipefail
        rm -rf release

    - name: Download firmware artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: release/artifacts
        merge-multiple: true

    # Untrusted values (tag, names, PR body) are passed via env: and referenced
    # as quoted "$VAR" so the shell never parses them as code (GAP-16).
    - name: Derive version and filenames
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_PACKAGE_NAME: ${{ inputs['package-name'] }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/derive_metadata.py" "$INPUT_TAG" "$INPUT_PACKAGE_NAME" "$INPUT_NAMESPACE"

    - name: Derive release name
      shell: bash
      env:
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
      run: |
        set -euo pipefail
        # VERSION and PACKAGE were exported to the job env by derive_metadata.py.
        if [ -n "$INPUT_RELEASE_NAME" ]; then
          release_name="$INPUT_RELEASE_NAME $VERSION"
        else
          release_name="$PACKAGE $VERSION"
        fi
        # A newline would let the value append extra KEY=VALUE lines to GITHUB_ENV.
        case "$release_name" in
          *$'\n'*|*$'\r'*) echo "::error::release name must be a single line" >&2; exit 1 ;;
        esac
        printf 'RELEASE_NAME=%s\n' "$release_name" >> "$GITHUB_ENV"

    - name: Create firmware bundle (.zip)
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/create_firmware_bundle.py"

    - name: Check PAT availability (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/check_pat.py"

    # ====================== PROD path (pushes to main) ======================
    - name: Configure AWS credentials (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_CODEARTIFACT_PUBLISHER }}
        aws-region:     ${{ env.AWS_REGION_CODEARTIFACT }}
        role-duration-seconds: 1800

    - name: Publish generic package to CodeArtifact (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/publish_codeartifact.py" --repository "$AWS_STM32_REPO_PROD"

    - name: Extract PR summary for release body (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: release-body
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/extract_release_body_from_pr.py" --tag "$INPUT_TAG"

    - name: Print release notes
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        # PR body is attacker-controllable text: never interpolate it into run:.
        RELEASE_BODY: ${{ steps.release-body.outputs.body }}
      run: |
        echo "===== RELEASE NOTES BEGIN ====="
        printf '%s\n' "$RELEASE_BODY"
        echo "===== RELEASE NOTES END ====="

    - name: Create/Update GitHub Release (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ env.RELEASE_NAME }}
        draft: false
        prerelease: false
        # We now fully control the body; no auto-generated notes.
        body: ${{ steps.release-body.outputs.body }}
        files: ${{ env.FILENAME }}
        token: ${{ env.GITHUB_ACTIONS_BOT }}

    # ================== DEV path (PRs and non-main pushes) ==================
    - name: Configure AWS credentials (DEV)
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_CODEARTIFACT_PUBLISHER }}
        aws-region:     ${{ env.AWS_REGION_CODEARTIFACT }}
        role-duration-seconds: 1800

    # A dev tag names the one commit a DEV version was built from, so a manifest
    # can pin it. Claimed before publishing: a re-run of the same commit finds its
    # own tag; anything else that already holds the version stops the run.
    - name: Claim dev tag (DEV)
      id: dev-tag
      if: ${{ inputs.dev-tag != '' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        DEV_TAG: ${{ inputs.dev-tag }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # VERSION, PACKAGE and NAMESPACE were exported by derive_metadata.py.
        if ! printf '%s' "$DEV_TAG" | grep -Eq '^dev/[A-Za-z0-9_.-]+$'; then
          echo "::error::dev-tag '$DEV_TAG' must look like dev/<prefix><version>" >&2; exit 1
        fi
        case "$DEV_TAG" in
          *"$VERSION") ;;
          *) echo "::error::dev-tag '$DEV_TAG' does not end with the published version $VERSION" >&2; exit 1 ;;
        esac
        if existing=$(gh api "repos/${REPO}/git/ref/tags/${DEV_TAG}" --jq '.object.sha' 2>/dev/null); then
          if [ "$existing" = "$SHA" ]; then
            echo "${DEV_TAG} already on ${SHA}: re-run of the same build"
            echo "state=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::${DEV_TAG} is already on ${existing}, not ${SHA}: two commits produced ${VERSION}" >&2
          exit 1
        fi
        # Only a confirmed "not found" lets the claim go ahead: access, throttling or
        # any other error stops the run rather than being read as "absent".
        if lookup=$(aws codeartifact describe-package-version \
             --domain "$AWS_DOMAIN" --domain-owner "$AWS_DOMAIN_OWNER" \
             --repository "$AWS_STM32_REPO_DEV" --format generic \
             --namespace "$NAMESPACE" --package "$PACKAGE" --package-version "$VERSION" \
             2>&1 >/dev/null); then
          echo "::error::${NAMESPACE}/${PACKAGE} ${VERSION} is already in ${AWS_STM32_REPO_DEV} but no ${DEV_TAG} says which commit built it" >&2
          exit 1
        elif ! printf '%s' "$lookup" | grep -q "ResourceNotFoundException"; then
          printf '%s\n' "$lookup" >&2
          echo "::error::could not check whether ${NAMESPACE}/${PACKAGE} ${VERSION} is in ${AWS_STM32_REPO_DEV}; not claiming ${DEV_TAG}" >&2
          exit 1
        fi
        gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${DEV_TAG}" -f sha="$SHA" >/dev/null
        echo "Tagged ${SHA} as ${DEV_TAG}"
        echo "state=created" >> "$GITHUB_OUTPUT"

    - name: Publish generic package to CodeArtifact (DEV)
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
      shell: bash
      env:
        DEV_TAG_STATE: ${{ steps.dev-tag.outputs.state }}
        GH_TOKEN: ${{ inputs.github_token }}
        DEV_TAG: ${{ inputs.dev-tag }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        output=""
        if ! output=$(python "${GITHUB_ACTION_PATH}/scripts/publish_codeartifact.py" --repository "$AWS_STM32_REPO_DEV" 2>&1); then
          if printf '%s' "$output" | grep -q "Cannot update existing generic package version"; then
            if [ "$DEV_TAG_STATE" = "created" ]; then
              # Someone else holds this version: take back the claim, so a re-run
              # does not find "its own" tag and pass the collision off as success.
              gh api -X DELETE "repos/${REPO}/git/refs/tags/${DEV_TAG}" >/dev/null \
                || echo "::warning::could not delete ${DEV_TAG}; delete it by hand before re-running" >&2
              echo "::error::${VERSION} appeared in ${AWS_STM32_REPO_DEV} while this run was claiming it; ${DEV_TAG} removed" >&2
              exit 1
            fi
            echo "Artifact already exists, skipping"
            exit 0
          fi
          printf '%s\n' "$output" >&2
          exit 1
        fi
