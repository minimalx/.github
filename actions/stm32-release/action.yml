name: "Publish STM32 Firmware (GitHub Release → AWS CodeArtifact)"
description: |
  Bundles STM32 firmware artifacts, uploads them to a GitHub release, and
  publishes the bundle to AWS CodeArtifact. Mirrors the behaviour of the
  Python build-deploy action: pull_request events push to the DEV repository,
  while pushes to refs/heads/main target the PROD repository.

inputs:
  tag:
    description: "Version tag to use (e.g., BCU_BL_v1.2.3 or v1.2.3-rc1). A clean semver is extracted for publishing."
    required: true
  artifact-pattern:
    description: "Artifact name or glob pattern to download (actions/download-artifact pattern syntax)."
    required: true
  package-name:
    description: "CodeArtifact package name to publish."
    required: true
  namespace:
    description: "CodeArtifact namespace for the generic package (required by generic format, e.g., 'bcu')."
    required: true
  github_token:
    description: "Token for 'gh' to call releases/generate-notes (usually GITHUB_TOKEN)."
    required: true
  release-name:
    description: "Override GitHub release name base (defaults to package-name)."
    required: false
    default: ""

outputs:
  release-notes:
    description: "Release notes Markdown derived from the associated pull request."
    value: ${{ steps.release-body.outputs.body }}

runs:
  using: "composite"
  steps:
    - name: Prepare release workspace
      shell: bash
      run: |
        set -euo pipefail
        rm -rf release

    - name: Download firmware artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: release/artifacts
        merge-multiple: true

    # Untrusted values (tag, names, PR body) are passed via env: and referenced
    # as quoted "$VAR" so the shell never parses them as code (GAP-16).
    - name: Derive version and filenames
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_PACKAGE_NAME: ${{ inputs['package-name'] }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/derive_metadata.py" "$INPUT_TAG" "$INPUT_PACKAGE_NAME" "$INPUT_NAMESPACE"

    - name: Derive release name
      shell: bash
      env:
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
      run: |
        set -euo pipefail
        # VERSION and PACKAGE were exported to the job env by derive_metadata.py.
        if [ -n "$INPUT_RELEASE_NAME" ]; then
          release_name="$INPUT_RELEASE_NAME $VERSION"
        else
          release_name="$PACKAGE $VERSION"
        fi
        # A newline would let the value append extra KEY=VALUE lines to GITHUB_ENV.
        case "$release_name" in
          *$'\n'*|*$'\r'*) echo "::error::release name must be a single line" >&2; exit 1 ;;
        esac
        printf 'RELEASE_NAME=%s\n' "$release_name" >> "$GITHUB_ENV"

    - name: Create firmware bundle (.zip)
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/create_firmware_bundle.py"

    - name: Check PAT availability (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/check_pat.py"

    # ====================== PROD path (pushes to main) ======================
    - name: Configure AWS credentials (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_CODEARTIFACT_PUBLISHER }}
        aws-region:     ${{ env.AWS_REGION_CODEARTIFACT }}
        role-duration-seconds: 1800

    - name: Publish generic package to CodeArtifact (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/publish_codeartifact.py" --repository "$AWS_STM32_REPO_PROD"

    - name: Extract PR summary for release body (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: release-body
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        python "${GITHUB_ACTION_PATH}/scripts/extract_release_body_from_pr.py" --tag "$INPUT_TAG"

    - name: Print release notes
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        # PR body is attacker-controllable text: never interpolate it into run:.
        RELEASE_BODY: ${{ steps.release-body.outputs.body }}
      run: |
        echo "===== RELEASE NOTES BEGIN ====="
        printf '%s\n' "$RELEASE_BODY"
        echo "===== RELEASE NOTES END ====="

    - name: Create/Update GitHub Release (PROD)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ env.RELEASE_NAME }}
        draft: false
        prerelease: false
        # We now fully control the body; no auto-generated notes.
        body: ${{ steps.release-body.outputs.body }}
        files: ${{ env.FILENAME }}
        token: ${{ env.GITHUB_ACTIONS_BOT }}

    # ================== DEV path (PRs and non-main pushes) ==================
    - name: Configure AWS credentials (DEV)
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_CODEARTIFACT_PUBLISHER }}
        aws-region:     ${{ env.AWS_REGION_CODEARTIFACT }}
        role-duration-seconds: 1800

    - name: Publish generic package to CodeArtifact (DEV)
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
      shell: bash
      run: |
        set -euo pipefail
        output=""
        if ! output=$(python "${GITHUB_ACTION_PATH}/scripts/publish_codeartifact.py" --repository "$AWS_STM32_REPO_DEV" 2>&1); then
          if printf '%s' "$output" | grep -q "Cannot update existing generic package version"; then
            echo "Artifact already exists, skipping"
            exit 0
          fi
          printf '%s\n' "$output" >&2
          exit 1
        fi
