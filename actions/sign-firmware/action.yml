name: "Sign Firmware (Ed25519)"
description: |
  Sign an Intel HEX firmware image with Ed25519 and patch the 64-byte
  signature into a fixed region at app_end - 68. Does NOT compute CRC --
  run the existing CRC step AFTER this action.

inputs:
  hex-path:
    description: "Path to the input Intel HEX file"
    required: true
  app-start:
    description: "App slot start address (e.g. 0x08020000)"
    required: true
  app-end:
    description: "App slot end address, exclusive (e.g. 0x08040000)"
    required: true
  output-path:
    description: "Output HEX path (defaults to in-place modification of hex-path)"
    required: false
    default: ""
  private-key:
    description: "PEM-encoded Ed25519 private key contents (pass secrets.FIRMWARE_SIGNING_PRIVATE_KEY)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Sign firmware
      shell: bash
      env:
        FIRMWARE_SIGNING_PRIVATE_KEY: ${{ inputs.private-key }}
        # Caller inputs go through env: instead of being spliced into the
        # script, because the signing key is in scope here (GAP-16).
        INPUT_HEX_PATH: ${{ inputs.hex-path }}
        INPUT_APP_START: ${{ inputs.app-start }}
        INPUT_APP_END: ${{ inputs.app-end }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        set -euo pipefail
        args=(
          --hex "$INPUT_HEX_PATH"
          --app-start "$INPUT_APP_START"
          --app-end "$INPUT_APP_END"
        )
        if [ -n "$INPUT_OUTPUT_PATH" ]; then
          args+=(--output "$INPUT_OUTPUT_PATH")
        fi
        sh "$GITHUB_ACTION_PATH/run.sh" "${args[@]}"
